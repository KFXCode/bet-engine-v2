document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"ae92786a-cae1-4529-8306-ef2f71e94a28\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: #f3f2f2; }\n    a { color: var(--color-accent-700); text-decoration: none; border-bottom: 1px solid var(--color-accent-300); }\n    a:hover { color: var(--color-accent); border-bottom-color: var(--color-accent); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#f3f2f2;color:#201e1d;font-family:'Archivo',system-ui,sans-serif\">\n\n  <div class=\"nav\" style=\"padding:14px 20px;gap:14px;position:sticky;top:0;background:#f3f2f2;z-index:5;flex-wrap:wrap\">\n    <div class=\"nav-brand\" style=\"font-size:19px;letter-spacing:-0.02em\">COVER1PICKS<span style=\"color:var(--color-accent)\"> / <\u002Fspan><span style=\"font-weight:400;font-size:13px;letter-spacing:0.06em;text-transform:uppercase\">Edge Engine<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n      <span class=\"tag tag-outline\">Edge ≥ {{ thresholdLabel }}<\u002Fspan>\n      <span class=\"tag\" style=\"border-radius:0;background:{{ feedBg }};color:{{ feedFg }}\">{{ feedLabel }}<\u002Fspan>\n      <button class=\"btn btn-ghost\" style=\"border-radius:0;padding:5px 10px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--color-divider)\" sc-camel-on-click=\"{{ refreshFeed }}\">Refresh<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;overflow:hidden;background:var(--color-accent);color:#f3f2f2;padding:26px 20px 24px;border-bottom:2px solid #201e1d\">\n    <img src=\"6d1c7024-8fdf-4075-b949-7c4874b9a1df\" alt=\"\" aria-hidden=\"true\" style=\"position:absolute;right:2%;top:50%;transform:translateY(-50%);height:132%;width:auto;opacity:.16;pointer-events:none\">\n    <div style=\"position:relative\">\n      <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;opacity:.85;margin-bottom:14px\">Moneyline · spread · player props — the engine runs the formula, you just place them<\u002Fdiv>\n      <div style=\"display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end\">\n        <div>\n          <div style=\"font-weight:800;font-size:clamp(38px,11vw,62px);line-height:1;letter-spacing:-0.03em\">{{ pickCount }} PICKS<\u002Fdiv>\n          <div style=\"font-size:14px;margin-top:8px;opacity:.9\">from {{ marketCount }} markets checked<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-weight:800;font-size:clamp(26px,7vw,40px);line-height:1\">{{ bestEdgeLabel }}<\u002Fdiv>\n          <div style=\"font-size:13px;opacity:.9\">biggest edge {{ scopeWord }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:20px;border-top:2px solid rgba(243,242,242,.5);padding-top:14px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap\">\n        <div style=\"font-weight:800;font-size:clamp(17px,5vw,22px);letter-spacing:-0.01em\">EVERY PICK IS A SINGLE BET<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.5;opacity:.9;max-width:560px;text-wrap:pretty\">Each one was priced on its own. Parlay these at your own risk — combining them multiplies the vig, and the engine has not checked whether the legs move together.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;border-bottom:2px solid var(--color-divider);padding:0 12px;flex-wrap:wrap\">\n    <button class=\"btn btn-ghost\" style=\"border-radius:0;padding:15px 14px;font-size:13px;letter-spacing:0.06em;text-transform:uppercase\" style-hover=\"background:rgba(32,30,29,.06)\" sc-camel-on-click=\"{{ goBoard }}\">Picks<\u002Fbutton>\n    <button class=\"btn btn-ghost\" style=\"border-radius:0;padding:15px 14px;font-size:13px;letter-spacing:0.06em;text-transform:uppercase\" style-hover=\"background:rgba(32,30,29,.06)\" sc-camel-on-click=\"{{ goPasses }}\">Passes<\u002Fbutton>\n    <button class=\"btn btn-ghost\" style=\"border-radius:0;padding:15px 14px;font-size:13px;letter-spacing:0.06em;text-transform:uppercase\" style-hover=\"background:rgba(32,30,29,.06)\" sc-camel-on-click=\"{{ goAhead }}\">Look ahead<\u002Fbutton>\n    <button class=\"btn btn-ghost\" style=\"border-radius:0;padding:15px 14px;font-size:13px;letter-spacing:0.06em;text-transform:uppercase\" style-hover=\"background:rgba(32,30,29,.06)\" sc-camel-on-click=\"{{ goRecord }}\">Record<\u002Fbutton>\n    <button class=\"btn btn-ghost\" style=\"border-radius:0;padding:15px 14px;font-size:13px;letter-spacing:0.06em;text-transform:uppercase\" style-hover=\"background:rgba(32,30,29,.06)\" sc-camel-on-click=\"{{ goWhy }}\">Why it works<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isBoard }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--color-divider)\">\n      <span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)\">Sport<\u002Fspan>\n      <sc-for list=\"{{ sportFilters }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <button class=\"btn\" style=\"border-radius:0;padding:7px 13px;font-size:12px;border:1px solid var(--color-divider);background:{{ f.bg }};color:{{ f.fg }}\" sc-camel-on-click=\"{{ f.pick }}\">{{ f.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700);margin-left:12px\">When<\u002Fspan>\n      <sc-for list=\"{{ whenFilters }}\" as=\"w\" hint-placeholder-count=\"2\">\n        <button class=\"btn\" style=\"border-radius:0;padding:7px 13px;font-size:12px;border:1px solid var(--color-divider);background:{{ w.bg }};color:{{ w.fg }}\" sc-camel-on-click=\"{{ w.pick }}\">{{ w.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700);margin-left:12px\">Bet type<\u002Fspan>\n      <sc-for list=\"{{ groupFilters }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <button class=\"btn\" style=\"border-radius:0;padding:7px 13px;font-size:12px;border:1px solid var(--color-divider);background:{{ m.bg }};color:{{ m.fg }}\" sc-camel-on-click=\"{{ m.pick }}\">{{ m.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasProps }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:14px 20px;border-bottom:2px solid var(--color-divider);border-left:4px solid var(--color-accent);background:var(--color-accent-100)\">\n        <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:6px\">Before you bet a player prop<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;max-width:900px;text-wrap:pretty\">{{ propsCaution }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:2px solid var(--color-divider);background:var(--color-neutral-100)\">\n      <span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)\">Your sportsbook<\u002Fspan>\n      <sc-raw-select class=\"input\" style=\"max-width:220px\" value=\"{{ book }}\" sc-camel-on-change=\"{{ setBook }}\">\n        <sc-for list=\"{{ bookNames }}\" as=\"b\" hint-placeholder-count=\"6\">\n          <option>{{ b }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <span style=\"font-size:12.5px;color:var(--color-neutral-800);line-height:1.5;max-width:430px;text-wrap:pretty\">{{ bookNote }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ picks }}\" as=\"p\" hint-placeholder-count=\"6\">\n      <div style=\"padding:20px;border-bottom:2px solid var(--color-divider)\">\n        <div style=\"display:flex;gap:14px;align-items:flex-start\">\n          <div style=\"min-width:44px\">\n            <div style=\"font-weight:800;font-size:30px;line-height:1;color:var(--color-accent)\">{{ p.rank }}<\u002Fdiv>\n            <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700);margin-top:4px\">{{ p.grade }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px\">\n              <span class=\"tag tag-accent\" style=\"border-radius:0\">{{ p.sport }}<\u002Fspan>\n              <span style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ p.market }} · {{ p.time }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-weight:800;font-size:clamp(20px,5.5vw,25px);line-height:1.15;letter-spacing:-0.02em\">{{ p.pick }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--color-neutral-700);margin-top:4px\">{{ p.game }} · price {{ p.price }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:12px;margin-top:16px;border-top:1px solid var(--color-divider);padding-top:14px\">\n          <div>\n            <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)\">Our %<\u002Fdiv>\n            <div style=\"font-weight:800;font-size:19px\">{{ p.our }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)\">Price says<\u002Fdiv>\n            <div style=\"font-weight:600;font-size:19px\">{{ p.theirs }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)\">Edge<\u002Fdiv>\n            <div style=\"font-weight:800;font-size:19px;color:#0f7a33\">{{ p.edge }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)\">EV per $1<\u002Fdiv>\n            <div style=\"font-weight:800;font-size:19px;color:#0f7a33\">{{ p.ev }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:16px\">\n          <a class=\"btn btn-primary\" style=\"border-radius:0;padding:11px 16px;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;border-bottom:0\" href=\"{{ p.bookUrl }}\" target=\"_blank\" rel=\"noopener\">Bet on {{ bookShort }}<\u002Fa>\n          <button class=\"btn btn-secondary\" style=\"border-radius:0;padding:11px 16px;font-size:13px;letter-spacing:0.04em;text-transform:uppercase\" sc-camel-on-click=\"{{ p.toggle }}\">{{ p.toggleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ p.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-left:2px solid var(--color-accent);padding:16px 18px;background:var(--color-accent-100)\">\n            <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px\">Why this one<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.6;text-wrap:pretty\">{{ p.why }}<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:18px 0 8px\">What EV per $1 means<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.6;text-wrap:pretty\">{{ p.evPlain }}<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:18px 0 8px\">The arithmetic, so you can check it<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.75;font-family:ui-monospace,Menlo,monospace;color:var(--color-neutral-900);white-space:pre-wrap;word-break:break-word\">{{ p.mathLine }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"padding:20px;font-size:13.5px;line-height:1.6;color:var(--color-neutral-800);max-width:940px\">{{ boardNote }}<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPasses }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:22px 20px 40px\">\n    <h3 style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin:0 0 8px\">Everything the engine threw away<\u002Fh3>\n    <p style=\"font-size:15px;line-height:1.6;max-width:820px;margin:0 0 20px;text-wrap:pretty\">These did not clear {{ thresholdLabel }} of edge. Most days this list is far longer than the pick list. That is the system working, not the system being boring.<\u002Fp>\n    <div style=\"overflow-x:auto\">\n      <sc-raw-table class=\"table\" style=\"width:100%;min-width:760px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left\">Game<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Market<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Best side<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Price<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Our %<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Price says<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Edge<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Why we skipped<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ passes }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <sc-raw-tr>\n              <sc-raw-td>{{ r.game }}<\u002Fsc-raw-td><sc-raw-td>{{ r.market }}<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:600\">{{ r.side }}<\u002Fsc-raw-td>\n              <sc-raw-td>{{ r.price }}<\u002Fsc-raw-td><sc-raw-td>{{ r.our }}<\u002Fsc-raw-td><sc-raw-td>{{ r.theirs }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"font-weight:600;color:var(--color-accent-700)\">{{ r.edge }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"max-width:300px\">{{ r.reason }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAhead }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:22px 20px 40px\">\n    <h3 style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin:0 0 8px\">Lines that are up but not yet playable<\u002Fh3>\n    <p style=\"font-size:15px;line-height:1.6;max-width:860px;margin:0 0 4px;text-wrap:pretty\">{{ aheadNote }}<\u002Fp>\n    <p style=\"font-size:13.5px;line-height:1.6;max-width:860px;margin:0 0 18px;color:var(--color-neutral-800);text-wrap:pretty\">No percent and no edge on these, on purpose. Pricing a game weeks out means trusting ratings that are weeks of results away from being right. The engine prices each one when it comes inside {{ windowLabel }}.<\u002Fp>\n\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px\">\n      <span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)\">Sport<\u002Fspan>\n      <sc-for list=\"{{ aheadFilters }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <button class=\"btn\" style=\"border-radius:0;padding:7px 13px;font-size:12px;border:1px solid var(--color-divider);background:{{ f.bg }};color:{{ f.fg }}\" sc-camel-on-click=\"{{ f.pick }}\">{{ f.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:2px solid var(--color-divider);margin-bottom:22px\">\n      <div style=\"padding:16px 18px;border-right:1px solid var(--color-divider)\">\n        <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Games posted<\u002Fdiv>\n        <div style=\"font-weight:800;font-size:28px\">{{ aheadCount }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;border-right:1px solid var(--color-divider)\">\n        <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Next one opens<\u002Fdiv>\n        <div style=\"font-weight:800;font-size:28px\">{{ aheadFirst }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px\">\n        <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Horizon<\u002Fdiv>\n        <div style=\"font-weight:800;font-size:28px\">{{ horizonLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"overflow-x:auto\">\n      <sc-raw-table class=\"table\" style=\"width:100%;min-width:720px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left\">Starts<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Sport<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Game<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Moneyline<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Spread<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Priced in<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ aheadRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <sc-raw-tr>\n              <sc-raw-td>{{ r.when }}<\u002Fsc-raw-td>\n              <sc-raw-td><span class=\"tag tag-neutral\" style=\"border-radius:0\">{{ r.sport }}<\u002Fspan><\u002Fsc-raw-td>\n              <sc-raw-td => this.state.aheadSport === 'All' || g.sport === this.state.aheadSport);\n    const aheadSports = ['All'].concat((this.state.lookahead || []).map(g => g.sport).filter((s, i, a) => a.indexOf(s) === i));\n    const bestEdge = filtered.length ? filtered[0].s.edge : null;\n\n    return {\n      thresholdLabel: th.toFixed(th % 1 ? 1 : 0) + ' pts',\n      coverageLabel: 'NFL · NCAA football · NBA · NCAA basketball',\n      feedLabel: this.state.feedStatus === 'live'\n        ? 'Live \\u00b7 ' + (this.state.feedAt ? new Date(this.state.feedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'updated')\n        : this.state.feedStatus === 'loading' ? 'Checking feed\\u2026' : 'Sample slate',\n      feedBg: this.state.feedStatus === 'live' ? green : 'var(--color-neutral-200)',\n      feedFg: this.state.feedStatus === 'live' ? '#f3f2f2' : 'var(--color-neutral-800)',\n      refreshFeed: () => { this.loadFeed(); this.loadResults(); },\n\n      pickCount: String(filtered.length),\n      marketCount: String(built.marketCount),\n      bestEdgeLabel: bestEdge == null ? '\\u2014' : this.signed(bestEdge) + ' pts',\n      scopeWord: todayOnly ? 'today' : 'this week',\n\n      isBoard: this.state.tab === 'board', isPasses: this.state.tab === 'passes',\n      isAhead: this.state.tab === 'ahead', isRecord: this.state.tab === 'record',\n      isWhy: this.state.tab === 'why',\n      goBoard: () => this.setState({ tab: 'board' }), goPasses: () => this.setState({ tab: 'passes' }),\n      goAhead: () => this.setState({ tab: 'ahead' }), goRecord: () => this.setState({ tab: 'record' }),\n      goWhy: () => this.setState({ tab: 'why' }),\n\n      sportFilters: sports.map(s => ({\n        name: s, bg: this.state.sport === s ? '#201e1d' : 'transparent',\n        fg: this.state.sport === s ? '#f3f2f2' : '#201e1d',\n        pick: () => this.setState({ sport: s })\n      })),\n      groupFilters: [{ k: 'All', name: 'All' }, { k: 'Sides', name: 'ML & spread' }, { k: 'Props', name: 'Player props' }].map(w => ({\n        name: w.name, bg: this.state.group === w.k ? 'var(--color-accent)' : 'transparent',\n        fg: this.state.group === w.k ? '#f3f2f2' : '#201e1d',\n        pick: () => this.setState({ group: w.k })\n      })),\n      whenFilters: [{ k: 'today', name: 'Today' }, { k: 'week', name: 'This week' }].map(w => ({\n        name: w.name, bg: this.state.when === w.k ? '#201e1d' : 'transparent',\n        fg: this.state.when === w.k ? '#f3f2f2' : '#201e1d',\n        pick: () => this.setState({ when: w.k })\n      })),\n\n      book: this.state.book,\n      bookNames: this.books().map(b => b.name),\n      bookShort: bk.short,\n      setBook: e => {\n        const v = e.target.value;\n        this.setState({ book: v });\n        try { window.localStorage.setItem('edgeEngine.book', v); } catch (err) {}\n      },\n      bookNote: 'The button under each pick opens ' + bk.short + '. Find the game, tap the line shown on the pick, and check the price still matches before you place it.',\n\n      picks,\n      boardNote: (filtered.length === 0\n        ? (todayOnly && built.picks.length\n            ? 'No games start today. There are ' + built.picks.length + ' picks on this week\\u2019s card \\u2014 tap This week to see them. An empty day is a normal day; the rule does not invent a bet to fill it. '\n            : 'Nothing clears the rule right now. ')\n        : '')\n        + 'Ranked by edge, biggest first. Grade A is 12 or more points of edge, B is 8 to 12, C is ' + th + ' to 8. Anything past ' + built.cap + ' points is treated as a model error rather than an opportunity and sent to Passes. Sides need ' + th + ' points, player props need ' + built.pth + ' \\u2014 one player is noisier than a whole team.',\n      propsCaution: 'On player props, read this first: the engine has no injury or inactive feed. A player listed questionable who then plays a handful of snaps will still be projected as though he were healthy, and that is the one way these picks go wrong quietly. Check the injury report before you place a prop. Props are also capped at ' + this.maxPerGame() + ' per game, because props in the same game move together.',\n      hasProps: filtered.some(p => p.isProp),\n\n      passes: built.passes.filter(r => !todayOnly || r.isToday).map(r => ({\n        game: r.game, market: r.market, side: r.side, price: this.amer(r.s.price),\n        our: this.pct(r.s.p), theirs: this.pct(r.s.imp),\n        edge: this.signed(r.s.edge) + ' pts', reason: r.reason\n      })),\n\n      windowLabel: '7 days', horizonLabel: '45 days',\n      aheadFilters: aheadSports.map(s => ({\n        name: s, bg: this.state.aheadSport === s ? '#201e1d' : 'transparent',\n        fg: this.state.aheadSport === s ? '#f3f2f2' : '#201e1d',\n        pick: () => this.setState({ aheadSport: s })\n      })),\n      aheadCount: String(ahead.length),\n      aheadFirst: ahead.length ? this.dayLabel(ahead[0].time) : '\\u2014',\n      aheadNote: ahead.length\n        ? 'There are ' + ahead.length + ' games posted past this week \\u2014 the earliest is ' + this.dayLabel(ahead[0].time) + '.'\n        : 'Nothing posted past this week yet for this sport.',\n      aheadRows: ahead.map(g => {\n        const days = Math.round((new Date(g.time) - Date.now()) / 86400000);\n        return {\n          when: this.dayLabel(g.time), sport: g.sport, game: g.away + ' @ ' + g.home,\n          ml: g.mlAway == null ? '\\u2014' : this.amer(g.mlAway) + ' / ' + this.amer(g.mlHome),\n          spread: g.spread == null ? '\\u2014' : g.home.split(' ').pop() + ' ' + this.signed(g.spread, 1),\n          opensIn: days <= 7 ? 'entering the window'\n            : (days - 7) + (days - 7 === 1 ? ' day' : ' days')\n        };\n      }),\n      aheadEmpty: ahead.length ? 'Prices shown away / home. The engine ignores all of it until the game is inside a week.' : 'Nothing to show for this sport right now.',\n\n      recordGroups,\n      gradedThrough: R.graded_through || 'Nothing yet',\n      splitNote: 'Two records, kept apart on purpose. Moneyline and spread come from team ratings; player props come from a completely separate model built on each player\\u2019s own game log. They clear different bars and they can succeed or fail independently \\u2014 averaging them together would let a good one cover for a bad one, which is exactly what you would want to know about.',\n\n      clvExplainer: avgClv == null\n        ? 'The closing line is the sharpest price anyone gets \\u2014 it is where all the money, injury news and sharp opinion finally lands. If the engine keeps taking prices better than that close, the edge is real, and you know it long before the win rate can prove anything. This fills in as picks grade.'\n        : (avgClv > 0\n            ? 'The engine is averaging ' + this.signed(avgClv) + ' points better than the closing line across ' + clvCount + ' graded picks. That is the meaningful signal this early: beating the close means the market moved toward our number after we bet it, which is what a real edge looks like. Win rate over a few weeks cannot tell a real edge from a hot streak \\u2014 this can.'\n            : 'The engine is averaging ' + this.signed(avgClv) + ' points against the closing line across ' + clvCount + ' graded picks. That is a warning sign regardless of the record: it means the market kept moving away from our prices. A winning week with negative closing-line value is usually luck, not edge.')\n        + ' Measured with the book\\u2019s margin divided out, against the last price seen before kickoff.',\n      gradingNote: recordGroups.reduce((a, g) => a + g.rows.length, 0)\n        ? 'Every pick is recorded the moment it is published, at the price it was published \\u2014 so nothing can be quietly rewritten later. Results post automatically as games go final. Win rate counts wins and losses only; pushes and voids are excluded, which is the standard way to read a record. A prop on a player who never took the field is voided by the book, so it is excluded too rather than counted as a loss.'\n        : 'Nothing graded yet \\u2014 no published pick has finished. Each pick is recorded when it goes up, at the price it went up at, and grades itself once the game is final. Watch the closing-line number first: it becomes meaningful in days, while a win rate needs months.',\n      gradedNote: 'One pick per game and market, or per player and market for props \\u2014 recorded at the price and line it was first published at, and graded against that number. When the line moves afterwards it is noted in the last column, but the pick is never regraded and never counted twice. Every published pick is graded, win or lose; nothing is quietly dropped.',\n\n      steps: [\n        { n: '1', title: 'Turn the price into a percent', body: 'Every price is a percent in disguise. Divide 1 by the decimal odds and you get what the book thinks the chance is. That is the number to beat.' },\n        { n: '2', title: 'Build our own percent', body: 'For moneyline and spread: team ratings fit from every finished game, plus a home-field bump measured from real results, which gives an expected winning margin. For player props: that same idea aimed at one person \\u2014 his own game log, recent games counted most, adjusted for the defense he is facing.' },\n        { n: '3', title: 'Subtract', body: 'Our percent minus theirs, written in points. Nine points of edge means we think it wins nine more times out of a hundred than the price is paying for.' },\n        { n: '4', title: 'Keep only the big gaps', body: 'Under ' + th + ' points, pass \\u2014 small gaps are usually our own error. Past ' + built.cap + ' points, also pass: a gap that wide against a liquid market means the model is broken, not that the book is asleep.' },\n        { n: '5', title: 'Grade everything, weekly', body: 'Once a week\\u2019s games are final, every published pick gets a result. Judge the system on hundreds of graded picks, never on one Saturday.' }\n      ],\n      axioms: [\n        { title: 'A chance is never below 0 or above 1', body: 'If a model spits out a 105% chance or calls something a sure thing, the model is broken. Fix it before betting it.' },\n        { title: 'All the outcomes add up to 100%', body: 'Win plus lose plus push must cover everything that can happen. Only half-point lines are used here, so nothing can push \\u2014 and the two sides always add to 100%.' },\n        { title: 'Separate outcomes add, together-outcomes do not', body: 'The chance a receiver catches 5 balls or 6 is the two chances added. But two things in the same game both happening is not simply multiplied \\u2014 they lean on each other. That is why props on one game are capped, and why the engine never builds you a parlay.' }\n      ],\n      traps: [\n        { title: 'Comparing your percent to the payout', body: 'A +250 price is not a 250% chance. Convert to a percent first (28.6%), then compare like with like.' },\n        { title: 'Moving your number after you see the line', body: 'If a 62% quietly slides to 57% once the price shows up, that is not an estimate anymore. The model sets the number first \\u2014 that is the point of a model.' },\n        { title: 'Betting tiny edges', body: 'A 2-point edge is smaller than the model\\u2019s own error bar. That is not a bet, it is a coin flip paying the house a fee.' },\n        { title: 'Trusting an enormous edge', body: 'A 40-point disagreement with a liquid market is not a gift, it is a bug. Those go to Passes on purpose.' },\n        { title: 'Judging by last night', body: 'A good bet loses all the time. Grade the edge you took, not the scoreboard \\u2014 the profit only shows up over hundreds of bets.' }\n      ],\n      mathBlock: 'All of the arithmetic: decimal = 1 + odds/100 for a plus price, 1 + 100/|odds| for a minus price. b = decimal \\u2212 1. Their percent = 1 \\u00f7 decimal. Edge = (our percent \\u2212 their percent) \\u00d7 100. EV per $1 = our percent \\u00d7 b \\u2212 (1 \\u2212 our percent). A pick needs edge \\u2265 ' + th + ' points, EV above zero, and edge no wider than ' + built.cap + ' points.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
