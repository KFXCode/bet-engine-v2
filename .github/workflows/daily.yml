name: Bet Engine slate

# All times UTC. Comments show Eastern during EDT (Mar-Nov); after the November
# DST change every Eastern time below shifts one hour earlier.
#
# Only the slate step spends odds-API credits. Grading is free, so it runs on
# every trigger.

on:
  schedule:
    # ---- Monday morning: the week's card goes up ----
    - cron: "45 12 * * 1"   # Mon  8:45am ET — publish the week
    # ---- near-kickoff slate refreshes, so the captured close is a real close ----
    - cron: "30 22 * * 4"   # Thu  6:30pm ET — before Thursday night games
    - cron: "0 15 * * 6"    # Sat 11:00am ET — before the college slate
    - cron: "30 2 * * 0"    # Sat 10:30pm ET — before late West Coast kickoffs
    - cron: "0 16 * * 0"    # Sun 12:00pm ET — before the early NFL window
    - cron: "0 23 * * 0"    # Sun  7:00pm ET — before Sunday night
    - cron: "0 23 * * 1"    # Mon  7:00pm ET — before Monday night
    # ---- grade-only: catches anything that finished overnight. No credits. ----
    - cron: "0 8 * * *"     # daily 4:00am ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The first run backfills a season of box scores for the player-prop model.
    # Later runs only pick up new games and finish in a couple of minutes.
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute ratings, pull FanDuel lines, price props, write the slate
        # Skipped on the 4am grade-only run — the only step that costs credits.
        if: github.event.schedule != '0 8 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
        run: python edge_slate.py

      - name: Record picks, track closing lines, grade results
        # Free — reads the slate on disk, and final scores and box scores from
        # ESPN. Appends the current price to each pending pick's history, but
        # only before kickoff, so the last entry is the closing line.
        run: python grade.py

      - name: Publish back to the repo
        run: |
          # Generated files, so they never need merging. Take the newest branch
          # state, then lay the fresh files on top.
          #
          # player_logs.json is the cached box-score history the prop model is
          # built from, and props_cache.json holds recently bought prop odds.
          # Both MUST be committed: without them every run rebuilds a season of
          # player history from scratch and re-buys prop markets it already paid
          # for.
          FILES="edge_slate.json picks_log.json results.json player_logs.json props_cache.json"
          mkdir -p /tmp/out
          for f in $FILES; do
            [ -f "$f" ] && cp "$f" /tmp/out/"$f"
          done
          git config user.name "bet-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          for f in $FILES; do
            [ -f /tmp/out/"$f" ] && cp /tmp/out/"$f" "$f"
          done
          git add -f $FILES 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to publish this run."
          else
            git commit -m "Slate + grading update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin "${GITHUB_REF_NAME}"
          fi
