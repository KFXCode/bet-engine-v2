name: Edge Engine slate

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute ratings, pull FanDuel lines, write the slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
        run: python edge_slate.py

      - name: Publish the slate back to the repo
        run: |
          # The slate is generated output, so it never needs merging. Take the
          # newest branch state, then lay the fresh slate on top. Rebasing here
          # only produced conflicts and a detached HEAD.
          cp edge_slate.json /tmp/edge_slate.json
          git config user.name "edge-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          cp /tmp/edge_slate.json edge_slate.json
          git add -f edge_slate.json
          if git diff --cached --quiet; then
            echo "Slate is unchanged since the last run."
          else
            git commit -m "Slate update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin "${GITHUB_REF_NAME}"
          fi
