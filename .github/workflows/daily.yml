name: Edge Engine slate

on:
  schedule:
    # once a day, 10:00 ET — free odds tier is 500 requests/month and
    # mlb-picks shares it. 4 requests per run ≈ 120/month.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute ratings, pull FanDuel lines, write the slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python edge_slate.py

      - name: Publish the slate back to the repo
        run: |
          git config user.name "edge-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f edge_slate.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to publish this check."
          else
            git commit -m "Slate update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
