name: Edge Engine slate

# All times UTC. Comments show Eastern during EDT (Mar-Nov); after the November
# DST change every Eastern time below shifts one hour earlier.
#
# Only the slate step spends odds-API credits (12 per run). Grading and the Whop
# post are free, so they run on every trigger.

on:
  schedule:
    # ---- Monday morning: the week's card goes up ----
    - cron: "45 12 * * 1"   # Mon  8:45am ET — publish the week
    # ---- near-kickoff slate refreshes, so the captured close is a real close ----
    - cron: "30 22 * * 4"   # Thu  6:30pm ET — before Thursday night games
    - cron: "0 15 * * 6"    # Sat 11:00am ET — before the college slate
    - cron: "30 2 * * 0"    # Sat 10:30pm ET — before late West Coast kickoffs
    - cron: "0 16 * * 0"    # Sun 12:00pm ET — before the early NFL window
    - cron: "0 23 * * 0"    # Sun  7:00pm ET — before Sunday night
    - cron: "0 23 * * 1"    # Mon  7:00pm ET — before Monday night
    # ---- grade-only: catches anything that finished overnight. No credits. ----
    - cron: "0 8 * * *"     # daily 4:00am ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute ratings, pull FanDuel lines, write the slate
        # Skipped on the 4am grade-only run — the only step that costs credits.
        if: github.event.schedule != '0 8 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
        run: python edge_slate.py

      - name: Record picks, track closing lines, grade results
        # Free — reads the slate on disk and final scores from ESPN. Appends the
        # current price to each pending pick's history, but only before kickoff,
        # so the last entry is the closing line.
        run: python grade.py

      - name: Post the card to the Whop forum
        # Members-only by construction: a forum post lives inside the Whop
        # experience, so access ends when a subscription does. Silent no-op if
        # the secrets are unset, and a Whop outage never fails the run.
        continue-on-error: true
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_EXPERIENCE_ID: ${{ secrets.WHOP_EXPERIENCE_ID }}
          MEMBER_LINK: ${{ secrets.MEMBER_LINK }}
        run: python whop_post.py

      - name: Publish back to the repo
        run: |
          # Generated files, so they never need merging. Take the newest branch
          # state, then lay the fresh files on top.
          FILES="edge_slate.json picks_log.json results.json whop_posted.json"
          mkdir -p /tmp/out
          for f in $FILES; do
            [ -f "$f" ] && cp "$f" /tmp/out/"$f"
          done
          git config user.name "edge-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          for f in $FILES; do
            [ -f /tmp/out/"$f" ] && cp /tmp/out/"$f" "$f"
          done
          git add -f $FILES 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to publish this run."
          else
            git commit -m "Slate + grading update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin "${GITHUB_REF_NAME}"
          fi
