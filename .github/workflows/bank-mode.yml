name: Bank Mode refresh

# Bank Mode's own schedule — separate from the engine's weekly slate.
# Only refreshes the Bank mode tab. Never touches picks, passes or the record.
# All times UTC. Comments show Eastern during EDT (Mar-Nov); after the November
# clock change every run lands one hour earlier in Eastern.
# Each time and what it checks is listed in bank_refresh.py (PLAN).

on:
  schedule:
    - cron: "5 15 * * *"    # daily 11:05am ET
    - cron: "0 22 * * *"    # daily  6:00pm ET
    - cron: "45 22 * * *"   # daily  6:45pm ET
    - cron: "30 13 * * 6"   # Sat    9:30am ET
    - cron: "45 18 * * 6"   # Sat    2:45pm ET
    - cron: "45 15 * * 0"   # Sun   11:45am ET
    - cron: "30 16 * * 0"   # Sun   12:30pm ET
    - cron: "0 19 * * 0"    # Sun    3:00pm ET
    - cron: "10 22 * * 0"   # Sun    6:10pm ET (next week's college lines)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bank-mode
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Refresh Bank Mode odds and rebuild the tab
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python bank_refresh.py

      - name: Publish Bank Mode files only
        run: |
          FILES="bank_odds.json bank_mode.json bank_log.json"
          mkdir -p /tmp/out
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/out/"$f"; done
          git config user.name "bet-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
            for f in $FILES; do [ -f /tmp/out/"$f" ] && cp /tmp/out/"$f" "$f"; done
            git add -f $FILES 2>/dev/null || true
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -m "Bank Mode refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin "${GITHUB_REF_NAME}" && exit 0
            echo "Push raced the engine's run - retrying"; sleep 15
          done
          exit 1
