name: Bank Mode refresh

# Bank Mode's own schedule — separate from the engine's weekly slate.
# Only refreshes the Bank mode tab. Never touches picks, passes or the record.
# GitHub schedules in UTC only, so each Eastern time is listed twice: one copy
# for daylight time (Mar-Nov) and one for standard time (Nov-Mar). Each run
# checks which applies today; the other copy exits without buying anything.
# Each time and what it checks is listed in bank_refresh.py (PLAN).
# GitHub runs these schedules hours late, so the Bank Mode clock
# (bank-keeper.yml) starts each check on time; a late copy here sees the
# check was just done and buys nothing.

on:
  schedule:
    - cron: "5 15 * * *"      # daily 11:05am ET (daylight time)
    - cron: "5 16 * * *"      # daily 11:05am ET (standard time)
    - cron: "35 17 * * *"     # daily 1:35pm ET (daylight time)
    - cron: "35 18 * * *"     # daily 1:35pm ET (standard time)
    - cron: "35 19 * * *"     # daily 3:35pm ET (daylight time)
    - cron: "35 20 * * *"     # daily 3:35pm ET (standard time)
    - cron: "50 21 * * *"     # daily 5:50pm ET (daylight time) props
    - cron: "50 22 * * *"     # daily 5:50pm ET (standard time) props
    - cron: "45 22 * * *"     # daily 6:45pm ET (daylight time) props
    - cron: "45 23 * * *"     # daily 6:45pm ET (standard time) props
    - cron: "30 13 * * 6"     # Sat   9:30am ET (daylight time)
    - cron: "30 14 * * 6"     # Sat   9:30am ET (standard time)
    - cron: "20 18 * * 6"     # Sat   2:20pm ET (daylight time)
    - cron: "20 19 * * 6"     # Sat   2:20pm ET (standard time)
    - cron: "45 18 * * 6"     # Sat   2:45pm ET (daylight time)
    - cron: "45 19 * * 6"     # Sat   2:45pm ET (standard time)
    - cron: "45 15 * * 0"     # Sun   11:45am ET (daylight time) props
    - cron: "45 16 * * 0"     # Sun   11:45am ET (standard time) props
    - cron: "30 16 * * 0"     # Sun   12:30pm ET (daylight time)
    - cron: "30 17 * * 0"     # Sun   12:30pm ET (standard time)
    - cron: "52 18 * * 0"     # Sun   2:52pm ET (daylight time) props
    - cron: "52 19 * * 0"     # Sun   2:52pm ET (standard time) props
    - cron: "10 22 * * 0"     # Sun   6:10pm ET (daylight time)
    - cron: "10 23 * * 0"     # Sun   6:10pm ET (standard time)
  workflow_dispatch:
    inputs:
      plan:
        description: "Which planned price check this is (left blank = check everything)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bank-mode
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Refresh Bank Mode odds and rebuild the tab
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
          SCHEDULE: ${{ github.event.schedule || inputs.plan }}
          SOURCE: ${{ github.event_name }}
        run: python bank_refresh.py

      - name: Publish Bank Mode files only
        run: |
          FILES="bank_odds.json bank_mode.json bank_log.json"
          mkdir -p /tmp/out
          for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/out/"$f"; done
          git config user.name "bet-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
            for f in $FILES; do [ -f /tmp/out/"$f" ] && cp /tmp/out/"$f" "$f"; done
            git add -f $FILES 2>/dev/null || true
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -m "Bank Mode refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin "${GITHUB_REF_NAME}" && exit 0
            echo "Push raced the engine's run - retrying"; sleep 15
          done
          exit 1
