name: Edge Agent weekly review
on:
  schedule: [{cron: "0 14 * * 2"}]   # Tuesdays 10am ET, after the weekend's grading
  workflow_dispatch:
permissions: {contents: write, pull-requests: write}
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m edge_agent.run --config edge_agent/config.yaml
      - name: Open PR with report + proposals (never merges itself)
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          D=$(date -u +%F); B="edge-agent/$D"
          git config user.name "edge-agent"; git config user.email "edge-agent@users.noreply.github.com"
          git checkout -b "$B"; git add reports/edge_agent
          git commit -m "Edge Agent review $D" || exit 0
          git push -u origin "$B"
          N=$(python -c "import json;print(len(json.load(open('reports/edge_agent/proposals.json'))['proposals']))")
          gh pr create --title "Edge Agent review $D ($N proposal(s))" --body-file "reports/edge_agent/$D.md"
